<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallop 82 &mdash; Pong</title>
<link rel="stylesheet" href="calc.css" />
</head>
<body>
<script src="calc.js"></script>
<script>
const c = Calc({ brand: "GALLOP 82" });
const ROWS = 8, COLS = 16;
const PH = 3;          // paddle height
const WIN = 5;         // first to 5
let py, ay, br, bc, dr, dc, ps, cs, timer, running;

function newGame() { ps = 0; cs = 0; serve(1); play(); }

function serve(dir) {
  py = 3; ay = 3; br = 4; bc = 8;
  dr = Math.random() < 0.5 ? -1 : 1;
  dc = dir;
}

function scoreHint() {
  return "YOU <strong>" + ps + "</strong> &mdash; CPU <strong>" + cs +
         "</strong> (first to " + WIN + ")";
}

function movePaddle(d) {
  py = Math.min(ROWS - PH + 1, Math.max(1, py + d));
  if (running) draw();
}

function tick() {
  if (!running) return;
  // CPU tracks the ball, but imperfectly so it's beatable
  const ac = ay + 1;
  if (Math.random() < 0.72) {
    if (ac < br) ay = Math.min(ROWS - PH + 1, ay + 1);
    else if (ac > br) ay = Math.max(1, ay - 1);
  }
  br += dr; bc += dc;
  if (br < 1) { br = 1; dr = 1; c.tone(520, 0.03); }
  if (br > ROWS) { br = ROWS; dr = -1; c.tone(520, 0.03); }

  if (dc < 0 && bc <= 2) {
    if (br >= py && br <= py + PH - 1) { dc = 1; bc = 2; bounce(py); }
    else return point("cpu");
  }
  if (dc > 0 && bc >= COLS - 1) {
    if (br >= ay && br <= ay + PH - 1) { dc = -1; bc = COLS - 1; bounce(ay); }
    else return point("you");
  }
  draw();
  timer = setTimeout(tick, 140);
}

function bounce(top) {
  // angle off the paddle: top cell sends ball up, bottom cell down
  const rel = br - top;            // 0..PH-1
  dr = rel === 0 ? -1 : rel === PH - 1 ? 1 : dr;
  c.tone(720, 0.04, "square", 0.13);
}

function point(who) {
  if (who === "you") ps++; else cs++;
  c.tone(who === "you" ? 900 : 240, 0.18, who === "you" ? "square" : "sawtooth", 0.14);
  if (ps >= WIN || cs >= WIN) return over();
  serve(who === "you" ? -1 : 1);   // serve toward whoever was scored on
  draw();
  c.setHint(scoreHint());
  timer = setTimeout(tick, 650);
}

function draw() {
  c.clr();
  for (let i = 0; i < PH; i++) { c.out(py + i, 1, "|"); c.out(ay + i, COLS, "|"); }
  c.out(br, bc, "o");
  c.render();
}

function play() {
  draw();
  c.setControls([
    { label: "\u25B2 UP", keys: ["ArrowUp", "w"], onClick: () => movePaddle(-1) },
    { label: "DOWN \u25BC", keys: ["ArrowDown", "s"], onClick: () => movePaddle(1) },
  ]);
  c.setHint(scoreHint());
  running = true;
  clearTimeout(timer);
  timer = setTimeout(tick, 700);
}

function over() {
  running = false;
  clearTimeout(timer);
  const won = ps > cs;
  c.clr();
  c.out(1, 1, won ? "YOU WIN!" : "CPU WINS");
  c.out(3, 1, "FINAL");
  c.out(4, 1, "YOU " + ps + "   CPU " + cs);
  c.render();
  if (won) c.arp([523, 659, 784, 1047], "triangle", 0.1);
  else c.arp([392, 330, 262], "sawtooth", 0.13, 0.13);
  c.setControls([{ label: "PLAY AGAIN", primary: true, onClick: newGame }]);
  c.setHint("Press <kbd>Enter</kbd> to play again.");
}

newGame();
</script>
</body>
</html>
